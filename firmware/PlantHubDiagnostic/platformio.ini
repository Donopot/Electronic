[platformio]
default_envs = heltec_v3_rx

[env:heltec_v3_rx]
platform = espressif32@6.12.0
board = heltec_wifi_lora_32_V3
framework = arduino
lib_deps =
    jgromes/RadioLib@7.8.1
    adafruit/Adafruit SSD1306@2.5.13
extra_scripts = pre:short_paths.py
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
upload_speed = 460800
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
