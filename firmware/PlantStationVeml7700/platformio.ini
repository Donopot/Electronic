[platformio]
default_envs = heltec_v3_text

[env]
platform = espressif32@6.12.0
board = heltec_wifi_lora_32_V3
framework = arduino
lib_deps =
    sparkfun/SparkFun VEML7700 Arduino Library@2.0.1
    sparkfun/SparkFun Toolkit@1.2.1
    adafruit/Adafruit SSD1306@2.5.13
    adafruit/Adafruit GFX Library@1.13.0
    adafruit/Adafruit BusIO@1.17.4
extra_scripts = pre:short_paths.py
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
upload_speed = 460800
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=0

[env:heltec_v3_text]
build_flags = ${env.build_flags} -DPLANT_JSON=0

[env:heltec_v3_json]
build_flags = ${env.build_flags} -DPLANT_JSON=1

[env:heltec_v3_soil_lora]
lib_extra_dirs = ../../lib
lib_deps =
    ${env.lib_deps}
    jgromes/RadioLib@7.8.1
build_flags = ${env.build_flags} -DPLANT_JSON=0 -DPLANT_SOIL_LORA=1

[env:heltec_v3_plant_dashboard]
lib_extra_dirs = ../../lib
lib_deps =
    ${env.lib_deps}
    jgromes/RadioLib@7.8.1
build_flags = ${env.build_flags} -DPLANT_JSON=0 -DPLANT_SOIL_LORA=1 -DPLANT_DASHBOARD=1

# Concentrateur sans capteur de lumiere : pas de scan I2C, pas de VEML7700,
# API lux=null / lux_available=false. Tableau de bord complet sur le Heltec.
[env:heltec_v3_soil_dashboard]
lib_extra_dirs = ../../lib
lib_deps =
    ${env.lib_deps}
    jgromes/RadioLib@7.8.1
build_flags = ${env.build_flags} -DPLANT_JSON=0 -DPLANT_SOIL_LORA=1 -DPLANT_DASHBOARD=1 -DPLANT_LUX=0 -DPLANT_ALWAYS_AP=1 -DPLANT_OPEN_AP=1
