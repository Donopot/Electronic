[platformio]
default_envs = weather_receiver_433

[env:weather_receiver_433]
platform = espressif32@6.12.0
board = esp32-c3-devkitm-1
framework = arduino
lib_deps =
    bblanchon/ArduinoJson@6.21.5
lib_extra_dirs = ../../lib
board_build.partitions = no_ota.csv
extra_scripts = pre:short_paths.py
monitor_speed = 115200
upload_speed = 460800
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DENVIRO_ENABLE_WEB=1
    -DENVIRO_REMOTE_SENSOR=1
    -DENVIRO_SAMPLE_MAX_AGE_MS=180000
