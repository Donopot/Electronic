[platformio]
default_envs = xiao_soil_diagnostic

[env]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git#a6fd41debbbcda13b5340fff50c9092ed3289194
board = seeed-xiao-afruitnrf52-nrf52840
framework = arduino
monitor_speed = 115200
build_flags = -DUSE_TINYUSB

[env:xiao_soil_diagnostic]

[env:xiao_soil_lora_tx]
lib_extra_dirs = ../../lib
lib_deps = jgromes/RadioLib@7.8.1
build_flags = ${env.build_flags} -DSOIL_LORA_TX=1
