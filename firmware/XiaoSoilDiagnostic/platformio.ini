[platformio]
default_envs = xiao_soil_diagnostic

[env]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git#a6fd41debbbcda13b5340fff50c9092ed3289194
board = seeed-xiao-afruitnrf52-nrf52840
framework = arduino
board_build.variants_dir = variants
monitor_speed = 115200
build_flags = -DUSE_TINYUSB

[env:xiao_soil_diagnostic]

[env:xiao_soil_lora_tx]
lib_extra_dirs = ../../lib
lib_deps = jgromes/RadioLib@7.8.1
build_flags = ${env.build_flags} -DSOIL_LORA_TX=1

[env:xiao_soil_lora_pmos]
extends = env:xiao_soil_lora_tx
build_flags = ${env:xiao_soil_lora_tx.build_flags} -DSOIL_PMOS_CONTROL=1

[env:xiao_soil_lora_pmos_node2]
extends = env:xiao_soil_lora_pmos
build_flags = ${env:xiao_soil_lora_pmos.build_flags} -DSOIL_NODE_ID=2

[env:xiao_soil_lora_pmos_node3]
extends = env:xiao_soil_lora_pmos
build_flags = ${env:xiao_soil_lora_pmos.build_flags} -DSOIL_NODE_ID=3
