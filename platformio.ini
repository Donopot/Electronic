[platformio]
default_envs = enviroterminal_diag
src_dir = firmware/EnviroTerminalDiagnostic

[env:enviroterminal_diag]
platform = espressif32@6.12.0
board = esp32-c3-devkitm-1
framework = arduino
lib_deps = duinoWitchery/hd44780@1.3.2
monitor_speed = 115200
upload_speed = 460800
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++14
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:enviroterminal_sensor_only]
extends = env:enviroterminal_diag
build_flags =
    ${env:enviroterminal_diag.build_flags}
    -DENVIRO_ENABLE_LCD=0

[env:enviroterminal_sensor_gpio4_1]
extends = env:enviroterminal_sensor_only
build_flags =
    ${env:enviroterminal_sensor_only.build_flags}
    -DENVIRO_BMP_SCL=1

[env:enviroterminal_sensor_gpio4_3]
extends = env:enviroterminal_sensor_only
build_flags =
    ${env:enviroterminal_sensor_only.build_flags}
    -DENVIRO_BMP_SDA=4
    -DENVIRO_BMP_SCL=3

[env:enviroterminal_bmp_lora_spi]
extends = env:enviroterminal_sensor_gpio4_3
build_flags =
    ${env:enviroterminal_sensor_gpio4_3.build_flags}
    -DENVIRO_ENABLE_LORA=1

[env:enviroterminal_local_web]
extends = env:enviroterminal_bmp_lora_spi
board_build.partitions = no_ota.csv
build_flags =
    ${env:enviroterminal_bmp_lora_spi.build_flags}
    -DENVIRO_ENABLE_WEB=1

[env:enviroterminal_meteo_tx]
extends = env:enviroterminal_bmp_lora_spi
lib_deps =
    ${env:enviroterminal_diag.lib_deps}
build_flags =
    ${env:enviroterminal_bmp_lora_spi.build_flags}
    -DENVIRO_ENABLE_LORA_TX=1

[env:enviroterminal_local_web_meteo_tx]
extends = env:enviroterminal_local_web
lib_deps =
    ${env:enviroterminal_meteo_tx.lib_deps}
build_flags =
    ${env:enviroterminal_local_web.build_flags}
    -DENVIRO_ENABLE_LORA_TX=1
