[platformio]
default_envs = lcd_test

[env:lcd_test]
platform = espressif32@6.12.0
board = esp32-c3-devkitm-1
framework = arduino
lib_deps = marcoschwartz/LiquidCrystal_I2C@1.1.4
monitor_speed = 115200
upload_speed = 460800
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:lcd_test_known_pins]
extends = env:lcd_test
build_flags =
    ${env:lcd_test.build_flags}
    -DLCD_TEST_SDA=4
    -DLCD_TEST_SCL=1

[env:lcd_test_gpio4_3]
extends = env:lcd_test
build_flags =
    ${env:lcd_test.build_flags}
    -DLCD_TEST_SDA=4
    -DLCD_TEST_SCL=3
